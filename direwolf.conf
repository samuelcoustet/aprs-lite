# direwolf.conf — aprs-aioc-relay-lite
# Généré automatiquement — modifier via le TUI (touche C)

ADEVICE plughw:AllInOneCable,0
ACHANNELS 1
ARATE 48000

CHANNEL 0
MYCALL F5ZVO
MODEM 1200
PTT CM108 /dev/hidraw0

# Timing CSMA
DWAIT 0
SLOTTIME 10
PERSIST 63
TXDELAY 60
TXTAIL 10

# Digipeater WIDE1/WIDE2
DIGIPEAT 0 0 ^WIDE[3-7]-[1-7]$ ^WIDE[12]-[12]$ TRACE
DEDUPE 30

# iGate RF->IS uniquement (IGTXVIA absent = pas de retransmission IS->RF)
# Note: [ig>tx] dans journalctl = paquets reçus depuis APRS-IS, non retransmis RF
IGSERVER euro.aprs2.net
IGLOGIN F5ZVO 8321
IGFILTER r/42.9783/-0.7493/200

# Beacon
# DISABLED PBEACON delay=1 every=30 overlay=R symbol="digi" lat=42^58.71N long=000^44.96W alt=1670 power=10 height=10 gain=5 dir=0 comment="Relais APRS La Pierre St-Martin 1670m"

KISSPORT 8001
AGWPORT 8000
LOGDIR /opt/aprs-lite/logs
